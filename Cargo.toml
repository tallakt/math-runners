[package]
name = "math-run"
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
ureq = "3.5.1"

[workspace]
members = [".", "xtask"]

[profile.release]
strip = true
